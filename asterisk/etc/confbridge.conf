;==========================
; Perfis de Bridge
;==========================

[roip_bridge]
type=bridge
max_members=50
mixing_interval=10
record_conference=no

;==========================
; Perfis de Usuario
;==========================

[roip_user]
type=user
admin=no
marked=no
startmuted=yes
music_on_hold_when_empty=no
quiet=yes
dtmf_passthrough=yes
dtmf_passthrough=yes
return_to_context=yes

[roip_admin]
type=user
admin=yes
startmuted=no
dtmf_passthrough=yes
return_to_context=yes

;===========================
; Perfis de Menu
;===========================

[roip_menu]
type=menu
*0=toggle_mute
*9=leave_conference