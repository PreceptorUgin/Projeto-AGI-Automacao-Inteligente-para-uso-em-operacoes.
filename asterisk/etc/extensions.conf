[general]
static=yes
writeprotect=no

[roip]
exten => _00XX,1,NoOp(Chamada interna para ${EXTEN})
   same => n,Dial(PJSIP/${EXTEN},30)
   same => n,Hangup()

;======================================
; Grupo geral - 1000
;======================================
exten => 1000,1,NoOp(Entrando no Grupo geral - 1000 - RoIP)

   same => n,ConfBridge(00,roip_bridge,roip_user)
   same => n,Hangup()

;=====================================
; PTT logico - 1000
;=====================================
exten => 1001,1,NoOp(PTT requisitado por ${CALLERID(NUM)} no grupo 00)
   same => n,Set(GROUP_ID=00)

   ; Chamando AGI
   same => n,AGI(roip_init.py,${GROUP_ID})
   same => n,NoOp(Sessao ${SESSION_ID} inicializada)

   ; Settando variaveis globais do grupo
   same => n,Set(LOCK_KEY=ROIP_${GROUP_ID}_LOCK) ;Lock global do grupo
   same => n,Set(QUEUE_ID=roip_queue_${GROUP_ID})

   ; Verificando disponibilidade
   same => n,Set(IS_BUSY=${DB_EXISTS(${LOCK_KEY})})
   same => n,GotoIf($["${IS_BUSY}"="1"]?enqueue_00:talk_00)
   
   ; Canal livre
   same => n(talk_00),NoOp(Fala liberada para ${CALLERID(num)})
   same => n,Set(DB(${LOCK_KEY})=${CALLERID(num)})
   same => n,ConfBridge(ROIP_${GROUP_ID},roip_bridge,roip_user)
   same => n,DBDel(${LOCK_KEY})
   same => n,Hangup()

   ; Canal ocupado
   same => n(enqueue_00),NoOp(Grupo ocupado, ${CALLERID(num)} entrou na fila)
   same => n,Queue(roip_queue,tT)
   same => n,Hangup()

;===================================
; Grupo geral - 1010
;===================================
exten => 1010,1,NoOp(Entrando no Grupo geral - 1010 - RoIP)

   same => n,ConfBridge(ROIP_01,roip_bridge,roip_user)
   same => n,Hangup()

;===================================
; PTT logico - 1010
;===================================
exten => 1011,1,NoOp(PTT requisitado por ${CALLERID(num)} no grupo 01)
   same => n,Set(GROUP_ID=01)

   ; Chamando AGI
   same => n,AGI(roip_init.py,${GROUP_ID})
   same => n,NoOp(Sessao ${SESSION_ID} inicializada)

   ; Settando variaveis globais do grupo
   same => n,Set(LOCK_KEY=ROIP_${GROUP_ID}_LOCK) ;Lock global do grupo
   same => n,Set(QUEUE_ID=roip_queue_${GROUP_ID})

   ; Verificando disponibilidade
   same => n,Set(IS_BUSY=${DB_EXISTS(${LOCK_KEY})})
   same => n,GotoIf($["${IS_BUSY}"="1"]?enqueue:talk)

   ; Canal livre
   same => n(talk_01),NoOp(Fala liberada para ${CALLERID(num)} no grupo 01)
   same => n,Set(DB(${LOCK_KEY})=${CALLERID(num)})
   same => n,ConfBridge(ROIP_${GROUP_ID},roip_bridge,roip_user)
   same => n,DBDel(${LOCK_KEY})
   same => n,Hangup()

   ; Canal ocupado
   same => n(enqueue_01),NoOp(Grupo 01 ocupado, ${CALLERID(num)} entrou na fila)
   same => n,Queue(${QUEUE_ID},tT)
   same => n,Hangup()
