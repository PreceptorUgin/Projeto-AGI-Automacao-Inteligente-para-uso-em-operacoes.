[general]
static=yes
writeprotect=no

[roip]
exten => _00XX,1,NoOp(Chamada interna para ${EXTEN})
   same => n,Dial(PJSIP/${EXTEN},30)
   same => n,Hangup()

;======================================
; Grupo geral - 1000
;======================================
exten => 1000,1,NoOp(Entrando no Grupo geral - 1000 - RoIP)
   same => n,Set(CHANNEL(hangup_handler)=ptt_hangup,s,1)
   same => n,ConfBridge(ROIP_00,roip_bridge,roip_user,roip_menu)
   same => n,Hangup()

;===================================
; Grupo geral - 1010
;===================================
exten => 1010,1,NoOp(Entrando no Grupo geral - 1010 - RoIP)
   same => n,Set(CHANNEL(hangup_handler)=ptt_hangup,s,1)
   same => n,ConfBridge(ROIP_01,roip_bridge,roip_user,roip_menu)
   same => n,Hangup()

;===================================
; Subrotinas de PTT
;===================================

[ptt_request]
exten => s,1,NoOp(PTT request de ${CALLERID(num)} no grupo ${CONFBRIDGE(bridge,uniqueid)})
   same => n,Set(GROUP_ID=${CONFBRIDGE(bridge,uniqueid)})
   same => n,Set(LOCK_KEY=ROIP_${GROUP_ID}_LOCK)
   same => n,Set(QUEUE_ID=roip_queue_${GROUP_ID})

   same => n,AGI(roip.agi,request,${GROUP_ID},${CALLERID(num)})

   same => n,Set(IS_BUSY=${DB_EXISTS(${LOCK_KEY})})
   same => n,GotoIf($["${IS_BUSY}"="1"]?busy:grant)

   same => n(grant),NoOp(Fala concedida)
   same => n,Set(DB(${LOCK_KEY})=${CALLERID(num)})
   same => n,Set(CONFBRIDGE(user,muted)=no)
   same => n,AGI(roip.agi,grant,${GROUP_ID},${CALLERID(num)})
   same => n,Return()

   same => n(busy),NoOp(Canal do grupo ocupado, entrando na Queue ${QUEUE_ID})
   same => n,AGI(roip.agi,enqueue,${GROUP_ID},${CALLERID(num)})
   same => n,Queue(${QUEUE_ID},t)
   same => n,NoOp(Queue retornou com status ${QUEUESTATUS})
   same => n,GotoIf($["${QUEUESTATUS}"="ANSWERED"]?dequeue)
   same => n,GotoIf($["${QUEUESTATUS}"="ABANDON"]?abandon)
   same => n,GotoIf($["${QUEUESTATUS}"="TIMEOUT"]?abandon)
   same => n,Return()

   same => n(dequeue),AGI(roip.agi,dequeue,${GROUP_ID},${CALLERID(num)})
   same => n,Return()

   same => n(abandon),AGI(roip.agi,abandon,${GROUP_ID},${CALLERID(num)})
   same => n,Return()

[ptt_release]
exten => s,1,NoOp(PTT release de ${CALLERID(num)})
   same => n,Set(GROUP_ID=${CONFBRIDGE(bridge,uniqueid)})
   same => n,Set(QUEUE_ID=roip_queue_${GROUP_ID})
   same => n,Set(LOCK_KEY=ROIP_${GROUP_ID}_LOCK)

   same => n,GotoIf($["DB(${LOCK_KEY})"="${CALLERID(num)}"]?ok:deny)

   same => n(ok),AGI(roip.agi,release,${GROUP_ID},${CALLERID(num)})
   same => n,DBDel(${LOCK_KEY})
   same => n,Set(CONFBRIDGE(user,muted)=yes)
   same => n,Return()

   same => n(deny),AGI(roip.agi,deny,${GROUP_ID},${CALLERID(num)})
   same => n,NoOp(${CALLERID(num)} tentou liberar sem posse)
   same => n,Return()

[ptt_hangup]
exten => s,1,NoOp(Hangup handler RoIP - limpando estado)
   same => n,Set(GROUP_ID=${CONFBRIDGE(bridge,uniqueid)})

   ; Só remove lock se este canal for o dono
   same => n,GotoIf($["${DB(ROIP_${GROUP_ID}_LOCK)}"="${CALLERID(num)}"]?clean:end)

   same => n(clean),NoOp(Limpando lock do grupo ${GROUP_ID})
   same => n,AGI(roip.agi,hangup,${GROUP_ID},${CALLERID(num)})
   same => n,DBDel(ROIP_${GROUP_ID}_LOCK)

   same => n(end),Return()

