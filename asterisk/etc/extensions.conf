[roip]
exten => 1000,1,NoOp(Entrando no Grupo geral - 1000 - RoIP)
 same => n,Set(GROUP_ID=ROIP_00)
 same => n,Set(SESSION_ID=${UNIQUEID})

 same => n,AGI(roip_logger.agi,join,${GROUP_ID},${CALLERID(num)},${SESSION_ID})

 same => n,Set(CHANNEL(hangup_handler_push)=roip-hangup,s,1(${GROUP_ID},${CALLERID(num)},${SESSION_ID}))

 same => n,ConfBridge(${GROUP_ID},roip_bridge,roip_user,roip_menu)

 ; === ÚNICA COISA NOVA ===
 same => n,GotoIf($["${CONFBRIDGE_RESULT}"="LEAVE"]?hangup,1)
 same => n,GotoIf($["${CONFBRIDGE_RESULT}"="HANGUP"]?hangup,1)
 same => n,GotoIf($["${CONFBRIDGE_RESULT}"="KICKED"]?hangup,1)

 same => n,Hangup()


[hangup]
exten => 1,1,Hangup()


[roip-hangup]
exten => s,1,AGI(roip_logger.agi,hangup,${ARG1},${ARG2},${ARG3})
 same => n,Return()
