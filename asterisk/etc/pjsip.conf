[global]
type=global
user_agent=asterisk

[transport-udp]
type=transport
protocolo=udp
bind=0.0.0.0

[endpoint-template](!)
type=endpoint
context=roip
disallow=all
allow=ulaw
allow=alaw
direct_media=no
force_rport=yes
rtp_symmetric=yes
rewrite_contact=yes

[aor-template](!)
type=aor
max_contacts=10
remove_existing=yes

[auth-template](!)
type=auth
auth_type=userpass

