[global]
type=global
user_agent=asterisk

;===========================
; Transporte SIP
;===========================
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

;============================
; Template base dos endpoints
;============================
[endpoint-template](!)
type=endpoint
context=roip
disallow=all
allow=ulaw
allow=alaw
transport=transport-udp
direct_media=no
force_rport=yes
rtp_symmetric=yes
rewrite_contact=yes
dtmf_mode=rfc4733

[aor-template](!)
type=aor
max_contacts=1
remove_existing=yes

[auth-template](!)
type=auth
auth_type=userpass

;=============================
; Usuarios
;=============================

; Usuario 0001
[0001](endpoint-template)
type=endpoint
auth=auth-0001
aors=0001

[auth-0001](auth-template)
type=auth
username=0001
password=0001pass

[0001](aor-template)
type=aor

