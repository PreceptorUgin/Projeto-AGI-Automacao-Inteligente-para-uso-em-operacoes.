{% extends "base.html" %}
{% set active = "settings" %}

{% block content %}
<div class="settings-view">
  <h2>Asterisk Settings</h2>

  <label>Server Address</label>
  <input type="text" placeholder="127.0.0.1"><br><br>

  <label>AMI Port</label>
  <input type="number" placeholder="5038"><br><br>

  <label>Default Queue</label>
  <select>
    <option>Support</option>
    <option>Sales</option>
    <option>Billing</option>
  </select>
</div>
{% endblock %}
