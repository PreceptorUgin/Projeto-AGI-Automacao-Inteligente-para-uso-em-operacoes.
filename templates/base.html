<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Call Center Admin Panel</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS principal -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <!-- Header com abas estilo navegador -->
  <header class="header">
    <div class="tabs">
      <a href="{{ url_for('logs') }}"
         class="tab {% if active == 'logs' %}active{% endif %}">
        Logs
      </a>

      <a href="{{ url_for('voicemail') }}"
         class="tab {% if active == 'voicemail' %}active{% endif %}">
        Voice Mail
      </a>

      <a href="{{ url_for('settings') }}"
         class="tab {% if active == 'settings' %}active{% endif %}">
        Settings
      </a>
    </div>
  </header>

  <!-- Conteúdo principal -->
  <main class="main-content">
    {% block content %}
    {% endblock %}
  </main>

  <!-- JS -->
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
